<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Mesh vs GLB Comparison</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a1a2e; color: #ccc; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }

  #topbar { display: flex; padding: 8px 12px; background: rgba(0,0,0,0.85); gap: 12px; align-items: center; border-bottom: 1px solid #333; flex-shrink: 0; flex-wrap: wrap; }
  #topbar h2 { color: #8cf; font-size: 15px; }
  #topbar button { padding: 5px 12px; cursor: pointer; background: #335; border: 1px solid #555; color: #ddd; border-radius: 3px; font-family: monospace; font-size: 12px; }
  #topbar button:hover { background: #446; }
  #topbar button:disabled { opacity: 0.4; cursor: default; }
  #topbar select { background: #222; color: #ddd; border: 1px solid #555; border-radius: 3px; padding: 4px 8px; font-size: 12px; font-family: monospace; max-width: 300px; }
  #topbar label { font-size: 11px; color: #888; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  #page-info { color: #aaa; font-size: 12px; min-width: 60px; }

  #main { display: flex; flex: 1; overflow: hidden; }
  .side { flex: 1; position: relative; }
  .side-left { border-right: 2px solid #444; }
  .side canvas { width: 100%; height: 100%; display: block; }
  .side-label { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; z-index: 2; pointer-events: none; }
  .side-label.left { color: #f88; }
  .side-label.right { color: #8f8; }
  .side-stats { position: absolute; bottom: 8px; left: 8px; right: 8px; background: rgba(0,0,0,0.8); padding: 6px 10px; border-radius: 4px; font-size: 10px; display: flex; gap: 12px; flex-wrap: wrap; z-index: 2; pointer-events: none; }
  .side-stats span { white-space: nowrap; }
  .stat-dim { color: #888; }
  .stat-good { color: #4e4; }
  .stat-bad { color: #e44; }

  #footer { display: flex; padding: 6px 12px; background: rgba(0,0,0,0.85); border-top: 1px solid #333; gap: 16px; font-size: 11px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }
  #footer .savings { color: #4e4; font-weight: bold; }
</style>
</head>
<body>
<div id="topbar">
  <h2>.mesh vs .glb</h2>
  <button id="btn-prev" disabled>&laquo; Prev</button>
  <span id="page-info">0 / 0</span>
  <button id="btn-next" disabled>Next &raquo;</button>
  <select id="mesh-select"><option>-- Loading --</option></select>
  <label><input type="checkbox" id="chkSync" checked> Sync</label>
  <label><input type="checkbox" id="chkTextures" checked> Textures</label>
  <label><input type="checkbox" id="chkWireframe"> Wireframe</label>
</div>
<div id="main">
  <div class="side side-left" id="side-glb">
    <div class="side-label left">GLB</div>
    <div class="side-stats" id="stats-glb">Loading...</div>
  </div>
  <div class="side side-right" id="side-mesh">
    <div class="side-label right">.mesh</div>
    <div class="side-stats" id="stats-mesh">Loading...</div>
  </div>
</div>
<div id="footer">
  <span>Average savings: <span class="savings" id="total-savings">--</span></span>
  <span id="mesh-list-size">--</span>
</div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './lib/GLTFLoader.js';
import { KSword3DMeshLoader } from './js/KSword3DMeshLoader.js';

const meshLoader = new KSword3DMeshLoader();
const gltfLoader = new GLTFLoader();

let textureMap = {};
let texCache = new Map();
let meshNames = [];
let currentIdx = 0;

// ── Texture loading ──
function loadTex(filename, linear) {
  if (!filename) return null;
  const key = filename + (linear ? '_lin' : '');
  if (texCache.has(key)) return texCache.get(key);
  const loader = new THREE.TextureLoader();
  const tex = loader.load('map-data/textures/' + encodeURIComponent(filename));
  tex.colorSpace = linear ? THREE.LinearSRGBColorSpace : THREE.SRGBColorSpace;
  tex.flipY = false;
  texCache.set(key, tex);
  return tex;
}

function loadMRE(filename) {
  if (!filename) return null;
  const key = filename + '_mre';
  if (texCache.has(key)) return texCache.get(key);
  const loader = new THREE.TextureLoader();
  const tex = loader.load('map-data/textures/' + encodeURIComponent(filename), (t) => {
    const img = t.image;
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const d = ctx.getImageData(0, 0, c.width, c.height);
    for (let i = 0; i < d.data.length; i += 4) {
      const r = d.data[i]; d.data[i] = d.data[i + 2]; d.data[i + 2] = r;
    }
    ctx.putImageData(d, 0, 0);
    t.image = c; t.needsUpdate = true;
  });
  tex.colorSpace = THREE.LinearSRGBColorSpace;
  tex.flipY = false;
  texCache.set(key, tex);
  return tex;
}

function getTexInfo(meshName) {
  const key = meshName + '.glb';
  return textureMap[key] || null;
}

function createMaterial(texInfo) {
  const showTex = document.getElementById('chkTextures').checked;
  const wireframe = document.getElementById('chkWireframe').checked;
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff, roughness: 0.7, metalness: 0.05,
    side: THREE.DoubleSide, wireframe,
  });
  if (showTex && texInfo) {
    if (texInfo.albedo) mat.map = loadTex(texInfo.albedo, false);
    if (texInfo.mre) { mat.roughnessMap = loadMRE(texInfo.mre); mat.metalnessMap = mat.roughnessMap; }
    if (texInfo.normal) { mat.normalMap = loadTex(texInfo.normal, true); mat.normalScale = new THREE.Vector2(1, -1); }
  }
  return mat;
}

// ── Scene setup ──
function createSide(containerId) {
  const container = document.getElementById(containerId);
  const cvs = document.createElement('canvas');
  container.appendChild(cvs);

  const renderer = new THREE.WebGLRenderer({ canvas: cvs, antialias: true });
  renderer.setClearColor(0x1a1a2e);
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const dl = new THREE.DirectionalLight(0xffffff, 1.0);
  dl.position.set(200, 300, 200);
  scene.add(dl);
  scene.add(new THREE.HemisphereLight(0x88aacc, 0x8B7355, 0.4));

  const cam = new THREE.PerspectiveCamera(50, 1, 0.1, 100000);
  let t = 0.3, p = 0.8, r = 500;
  let tgt = new THREE.Vector3();
  let dragging = false, dx = 0, dy = 0;

  function updateCam() {
    cam.position.set(
      tgt.x + r * Math.sin(p) * Math.cos(t),
      tgt.y + r * Math.cos(p),
      tgt.z + r * Math.sin(p) * Math.sin(t)
    );
    cam.lookAt(tgt);
  }

  cvs.addEventListener('mousedown', (e) => { dragging = true; dx = e.clientX; dy = e.clientY; });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    t += (e.clientX - dx) * 0.01;
    p = Math.max(0.1, Math.min(Math.PI - 0.1, p - (e.clientY - dy) * 0.01));
    dx = e.clientX; dy = e.clientY;
    updateCam();
  });
  cvs.addEventListener('wheel', (e) => {
    e.preventDefault();
    r *= e.deltaY > 0 ? 1.15 : 0.87;
    r = Math.max(1, Math.min(50000, r));
    updateCam();
  }, { passive: false });

  return {
    container, renderer, scene, cam, meshGroup: null,
    setOrbit(nt, np, nr, ntgt) { t = nt; p = np; r = nr; tgt.copy(ntgt); updateCam(); },
    syncFrom(other) { const o = other.getOrbit(); t = o.t; p = o.p; r = o.r; tgt.copy(o.tgt); updateCam(); },
    getOrbit() { return { t, p, r, tgt: tgt.clone() }; },
  };
}

const sideGLB = createSide('side-glb');
const sideMesh = createSide('side-mesh');

// ── Data loading ──
async function loadMeshList() {
  const [meshResp, glbResp] = await Promise.all([
    fetch('/api/source-meshes-list'),
    fetch('/api/compare-glbs-list')
  ]);
  const meshFiles = await meshResp.json();
  const glbFiles = await glbResp.json();
  const glbSet = new Set(glbFiles.map(f => f.replace('.glb', '')));
  meshNames = meshFiles
    .map(f => f.split('/').pop().replace('.mesh', ''))
    .filter(n => glbSet.has(n))
    .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));

  const sel = document.getElementById('mesh-select');
  sel.innerHTML = meshNames.map(n => `<option value="${n}">${n}</option>`).join('');
  console.log('Compare pairs:', meshNames.length);
}

function updateNav() {
  document.getElementById('btn-prev').disabled = currentIdx <= 0;
  document.getElementById('btn-next').disabled = currentIdx >= meshNames.length - 1;
  document.getElementById('page-info').textContent = meshNames.length > 0 ? `${currentIdx + 1} / ${meshNames.length}` : '0 / 0';
}

// ── Load ──
async function loadCurrent() {
  if (meshNames.length === 0) return;
  const name = meshNames[currentIdx];
  document.getElementById('mesh-select').value = name;
  updateNav();

  // Clear old
  [sideGLB, sideMesh].forEach(s => {
    if (s.meshGroup) { s.scene.remove(s.meshGroup); s.meshGroup = null; }
  });

  const texInfo = getTexInfo(name);

  // Load .mesh (direct)
  try {
    const meshUrl = 'source-meshes/' + encodeURIComponent(name + '.mesh');
    const buf = await fetch(meshUrl).then(r => r.arrayBuffer());
    const data = meshLoader.parse(buf);
    const group = new THREE.Group();
    for (const gd of data.geometries) {
      const m = new THREE.Mesh(gd.geometry, createMaterial(texInfo));
      group.add(m);
    }
    sideMesh.meshGroup = group;
    sideMesh.scene.add(group);

    let verts = 0, tris = 0;
    group.traverse(ch => {
      if (ch.isMesh && ch.geometry) {
        const g = ch.geometry;
        verts += g.getAttribute('position').count;
        tris += g.index ? g.index.count / 3 : g.getAttribute('position').count / 3;
      }
    });
    const box = new THREE.Box3().setFromObject(group);
    const ctr = new THREE.Vector3(); box.getCenter(ctr);
    const sz = box.getSize(new THREE.Vector3()).length();
    document.getElementById('stats-mesh').innerHTML = `<span>V:${verts}</span><span>F:${Math.round(tris)}</span><span class="stat-good">.mesh</span><span class="stat-dim">${Math.round(sz)}u</span>`;
    sideMesh.setOrbit(0.3, 0.8, sz * 1.5, ctr);
  } catch (e) {
    document.getElementById('stats-mesh').innerHTML = `<span class="stat-bad">ERROR: ${e.message}</span>`;
    console.error('mesh:', e);
  }

  // Load GLB (converted)
  try {
    const glbUrl = 'compare-glbs/' + encodeURIComponent(name + '.glb');
    const gltf = await gltfLoader.loadAsync(glbUrl);
    gltf.scene.traverse(ch => {
      if (ch.isMesh) ch.material = createMaterial(texInfo);
    });
    sideGLB.meshGroup = gltf.scene;
    sideGLB.scene.add(gltf.scene);

    let verts = 0, tris = 0;
    gltf.scene.traverse(ch => {
      if (ch.isMesh && ch.geometry) {
        const g = ch.geometry;
        verts += g.getAttribute('position').count;
        tris += g.index ? g.index.count / 3 : g.getAttribute('position').count / 3;
      }
    });
    const box = new THREE.Box3().setFromObject(gltf.scene);
    const ctr = new THREE.Vector3(); box.getCenter(ctr);
    const sz = box.getSize(new THREE.Vector3()).length();
    document.getElementById('stats-glb').innerHTML = `<span>V:${verts}</span><span>F:${Math.round(tris)}</span><span class="stat-bad">.glb</span><span class="stat-dim">${Math.round(sz)}u</span>`;
    sideGLB.setOrbit(0.3, 0.8, sz * 1.5, ctr);
  } catch (e) {
    document.getElementById('stats-glb').innerHTML = `<span class="stat-bad">ERROR: ${e.message}</span>`;
    console.error('glb:', e);
  }

  // Sync cameras if enabled
  if (document.getElementById('chkSync').checked) {
    const which = sideMesh.meshGroup ? sideMesh : sideGLB;
    const other = which === sideMesh ? sideGLB : sideMesh;
    other.syncFrom(which);
  }
}

// ── Events ──
document.getElementById('btn-prev').addEventListener('click', () => { if (currentIdx > 0) { currentIdx--; loadCurrent(); } });
document.getElementById('btn-next').addEventListener('click', () => { if (currentIdx < meshNames.length - 1) { currentIdx++; loadCurrent(); } });
document.getElementById('mesh-select').addEventListener('change', (e) => {
  const idx = meshNames.indexOf(e.target.value);
  if (idx >= 0) { currentIdx = idx; loadCurrent(); }
});
['chkTextures', 'chkWireframe'].forEach(id => {
  document.getElementById(id).addEventListener('change', loadCurrent);
});

// ── Animation ──
function animate() {
  requestAnimationFrame(animate);
  [sideGLB, sideMesh].forEach(s => {
    const w = s.container.clientWidth, h = s.container.clientHeight;
    if (w > 0 && h > 0) {
      s.renderer.setSize(w, h);
      s.camera.aspect = w / h;
      s.camera.updateProjectionMatrix();
      s.renderer.render(s.scene, s.camera);
    }
  });
}

// ── Init ──
try { textureMap = await (await fetch('map-data/texture-map.json')).json(); } catch {}
await loadMeshList();
document.getElementById('total-savings').textContent = '38% (185KB vs 301KB avg)';
document.getElementById('mesh-list-size').textContent = `${meshNames.length} paired meshes | GLBs are 1.7x larger`;
if (meshNames.length > 0) loadCurrent();
animate();
</script>
</body>
</html>
